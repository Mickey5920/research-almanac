<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc"><title id="title">周易论文投稿择时工作流</title><desc id="desc">在 Agent 中输入，Skill 本地计算并保存记录，HTML 离线展示。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b282b"/><stop offset="1" stop-color="#153e39"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#bfa16b" stroke-opacity=".07"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#d7b97f"/></marker></defs><rect width="1440" height="760" rx="24" fill="url(#bg)"/><rect width="1440" height="760" fill="url(#grid)"/><g font-family="Segoe UI,Microsoft YaHei,Arial,sans-serif"><text x="60" y="62" font-size="14" fill="#d7b97f" font-weight="600">ZHOUYI / LOCAL SUBMISSION PLANNING</text><text x="60" y="118" font-size="36" fill="#f8f3e5" font-weight="600">从论文项目，到可执行的投稿安排</text><text x="60" y="160" font-size="18" fill="#b8cfc8" font-weight="400">工作流程示意 · HTML 展示已保存的输入与结果</text><rect x="60" y="212" width="420" height="250" rx="16" fill="#153936" stroke="#6c9885"/><text x="84" y="253" font-size="18" fill="#d7b97f" font-weight="600">01</text><text x="84" y="301" font-size="27" fill="#f8f3e5" font-weight="600">Agent 对话</text><text x="84" y="343" font-size="18" fill="#d1e1d9" font-weight="400">论文项目 · 准备状态</text><text x="84" y="379" font-size="18" fill="#d1e1d9" font-weight="400">截止日期 · 时区 · 可用时间</text><text x="84" y="415" font-size="18" fill="#d1e1d9" font-weight="400">可选：个人星座与投稿偏好</text><path d="M480 330h30" stroke="#d7b97f" stroke-width="2" marker-end="url(#arrow)"/><rect x="510" y="212" width="420" height="250" rx="16" fill="#153936" stroke="#6c9885"/><text x="534" y="253" font-size="18" fill="#d7b97f" font-weight="600">02</text><text x="534" y="301" font-size="27" fill="#f8f3e5" font-weight="600">本地 Skill 计算</text><text x="534" y="343" font-size="18" fill="#d1e1d9" font-weight="400">现实约束与截止余量</text><text x="534" y="379" font-size="18" fill="#d1e1d9" font-weight="400">适用学术依据 → 文化参考</text><text x="534" y="415" font-size="18" fill="#d1e1d9" font-weight="400">生成时间、朝向与八卦原文解读</text><path d="M930 330h30" stroke="#d7b97f" stroke-width="2" marker-end="url(#arrow)"/><rect x="960" y="212" width="420" height="250" rx="16" fill="#173b43" stroke="#719aa8"/><text x="984" y="253" font-size="18" fill="#d7b97f" font-weight="600">03</text><text x="984" y="301" font-size="27" fill="#f8f3e5" font-weight="600">只读 HTML 报告</text><text x="984" y="343" font-size="18" fill="#d1e1d9" font-weight="400">首选窗口 + 不同日期备选</text><text x="984" y="379" font-size="18" fill="#d1e1d9" font-weight="400">本次输入 · 历史对比 · 八卦总览</text><text x="984" y="415" font-size="18" fill="#d1e1d9" font-weight="400">中文 / English · 离线展开详情</text><path d="M720 463v46h450v-46" fill="none" stroke="#d7b97f" stroke-width="2"/><rect x="550" y="520" width="720" height="71" rx="12" fill="#112e30" stroke="#b89c64"/><text x="574" y="550" font-size="19" fill="#eed5a5" font-weight="600">本地记录：输入 + 结果 · 每次调用新增快照</text><text x="574" y="575" font-size="16" fill="#b8cfc8" font-weight="400">HTML 不连接模型，不重新计算；新调用生成新的报告。</text><text x="60" y="552" font-size="19" fill="#d1e1d9" font-weight="400">继续调整？回到 Agent 对话。</text><path d="M60 630H1380" stroke="#6b8876" stroke-opacity=".5"/><text x="60" y="680" font-size="27" fill="#e8cc94" font-weight="600">玄学提供仪式感，科学提供优先级</text><text x="60" y="719" font-size="18" fill="#b8cfc8" font-weight="400">文化意象辅助安排；适用证据、准备条件和截止要求决定可行性。</text></g></svg>