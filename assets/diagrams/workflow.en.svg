<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc"><title id="title">Zhouyi submission planning workflow</title><desc id="desc">Provide context in the Agent. The Skill computes and saves local records. HTML displays the snapshot offline.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b282b"/><stop offset="1" stop-color="#153e39"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#bfa16b" stroke-opacity=".07"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#d7b97f"/></marker></defs><rect width="1440" height="760" rx="24" fill="url(#bg)"/><rect width="1440" height="760" fill="url(#grid)"/><g font-family="Segoe UI,Microsoft YaHei,Arial,sans-serif"><text x="60" y="62" font-size="14" fill="#d7b97f" font-weight="600">ZHOUYI / LOCAL SUBMISSION PLANNING</text><text x="60" y="118" font-size="36" fill="#f8f3e5" font-weight="600">From manuscript context to a practical submission plan</text><text x="60" y="160" font-size="18" fill="#b8cfc8" font-weight="400">Workflow illustration · HTML displays saved inputs and results</text><rect x="60" y="212" width="420" height="250" rx="16" fill="#153936" stroke="#6c9885"/><text x="84" y="253" font-size="18" fill="#d7b97f" font-weight="600">01</text><text x="84" y="301" font-size="27" fill="#f8f3e5" font-weight="600">Agent conversation</text><text x="84" y="343" font-size="18" fill="#d1e1d9" font-weight="400">Project context and readiness</text><text x="84" y="379" font-size="18" fill="#d1e1d9" font-weight="400">Deadline, time zone, availability</text><text x="84" y="415" font-size="18" fill="#d1e1d9" font-weight="400">Optional personal sign and preferences</text><path d="M480 330h30" stroke="#d7b97f" stroke-width="2" marker-end="url(#arrow)"/><rect x="510" y="212" width="420" height="250" rx="16" fill="#153936" stroke="#6c9885"/><text x="534" y="253" font-size="18" fill="#d7b97f" font-weight="600">02</text><text x="534" y="301" font-size="27" fill="#f8f3e5" font-weight="600">Local Skill computation</text><text x="534" y="343" font-size="18" fill="#d1e1d9" font-weight="400">Constraints and deadline buffer</text><text x="534" y="379" font-size="18" fill="#d1e1d9" font-weight="400">Applicable evidence, then tradition</text><text x="534" y="415" font-size="18" fill="#d1e1d9" font-weight="400">Times, directions and trigram references</text><path d="M930 330h30" stroke="#d7b97f" stroke-width="2" marker-end="url(#arrow)"/><rect x="960" y="212" width="420" height="250" rx="16" fill="#173b43" stroke="#719aa8"/><text x="984" y="253" font-size="18" fill="#d7b97f" font-weight="600">03</text><text x="984" y="301" font-size="27" fill="#f8f3e5" font-weight="600">Read-only HTML report</text><text x="984" y="343" font-size="18" fill="#d1e1d9" font-weight="400">Preferred and alternative dates</text><text x="984" y="379" font-size="18" fill="#d1e1d9" font-weight="400">Inputs, history and eight-trigram atlas</text><text x="984" y="415" font-size="18" fill="#d1e1d9" font-weight="400">中文 / English · Offline details</text><path d="M720 463v46h450v-46" fill="none" stroke="#d7b97f" stroke-width="2"/><rect x="550" y="520" width="720" height="71" rx="12" fill="#112e30" stroke="#b89c64"/><text x="574" y="550" font-size="19" fill="#eed5a5" font-weight="600">Local records: inputs + results · A new snapshot per run</text><text x="574" y="575" font-size="16" fill="#b8cfc8" font-weight="400">HTML does not call a model or recompute. New runs produce new reports.</text><text x="60" y="552" font-size="19" fill="#d1e1d9" font-weight="400">Need a change? Return to the Agent.</text><path d="M60 630H1380" stroke="#6b8876" stroke-opacity=".5"/><text x="60" y="680" font-size="27" fill="#e8cc94" font-weight="600">Mysticism offers ritual; science sets priorities.</text><text x="60" y="719" font-size="18" fill="#b8cfc8" font-weight="400">Cultural symbolism supports the ritual; applicable evidence and real constraints guide the plan.</text></g></svg>